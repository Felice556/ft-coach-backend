# A ogni push GitHub prepara un database PostgreSQL di prova, crea le tabelle
# con le migrazioni e fa girare tutti i test. Nessun dato vero viene toccato.
name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ftcoach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ftcoach_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ftcoach_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Crea le tabelle nel database di prova
        run: npm run test:db
      - name: Compila (TypeScript)
        run: npm run build
      - name: Test
        run: npm test
